sonar.projectKey=Finfinder_DQN_Framework
sonar.organization=finfinder

sonar.sources=.
sonar.inclusions=**/*.py
sonar.exclusions=.venv/**,logs/**,metrics/**,**/__pycache__/**

sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.coverage.exclusions=train.py,evaluate.py,play.py,tuning_test.py,version.py,utils/analyze.py

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.10,3.11

sonar.sourceEncoding=UTF-8
