name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  version-consistency:
    permissions:
      contents: read
    uses: Finfinder/AI_Instruction/.github/workflows/reusable-version-consistency.yml@main
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.ref }}
      expected-version: ${{ github.ref_name }}
    secrets: inherit

  next-version-request:
    permissions:
      contents: read
    uses: Finfinder/AI_Instruction/.github/workflows/reusable-next-version-request.yml@main
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.ref }}
      expected-release-version: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [version-consistency, next-version-request]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed release notes.
