name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  version-consistency:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-version-consistency.yml
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.ref }}
      expected-version: ${{ github.ref_name }}

  next-version-request:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-next-version-request.yml
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.ref }}
      expected-release-version: ${{ github.ref_name }}

  release:
    needs: [version-consistency, next-version-request]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed release notes.
