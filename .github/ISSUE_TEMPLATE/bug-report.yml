name: Bug Report
description: Report a reproducible bug or regression.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in DQN Framework.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the closest affected area.
      options:
        - agent
        - training
        - environment
        - evaluation
        - other
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Use environment ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: env_name
    attributes:
      label: Environment
      placeholder: e.g. CartPole-v1 or ALE/Pong-v5
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: e.g. CPU, CUDA, or specific device details
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for existing issues before opening this report.
          required: true
